<!DOCTYPE html>
<html lang="en">
<!-- 
    DOCTYPE tells the browser this is an HTML5 document
     "lang" attribute specifies the page language (English)  
-->

<head>
 <!-- head includes metadata about the html document not displayed on 
the actual webpage -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- makes page size responsive -->
  <title>Shared Waters Team</title>
  <!-- this is our title  -->
  <link rel="stylesheet" type="text/css" href="styles.css">
  <!-- connects this html file to the styles.css file  -->
</head>

<body>
 <!-- everything visible on the webpage goes here -->
